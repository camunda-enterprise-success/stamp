# The camunda-namespace copy of the MinIO credentials the orchestration release reads for the Zeebe
# runtime (primary storage) backup (CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_ACCESSKEY/SECRETKEY in
# ../values_with_backup_restore_elasticsearch.yml and ../values_to_restore_oc_elasticsearch.yml).
#
# Kubernetes Secrets are namespace-scoped and MinIO runs in its own "minio" namespace
# (../backup/minio.yaml), so its credentials must be copied here for the Camunda chart to use - the
# same reasoning as ../camunda-secrets.yaml on the RDBMS track. That file (which also carries
# minio-credentials) is NOT applied on the Elasticsearch/Optimize track, so this standalone copy
# is what the +backup layer of that track depends on. Values match ../backup/minio.yaml.
#
# Apply as part of enabling backups (ENABLEMENT_INSTALLATION_ELASTICSEARCH.MD, backup section), before the
# `helm upgrade --install` that adds values_with_backup_restore_elasticsearch.yml. Swap the inlined
# dev values for generated passwords before this is anything but a local/dev cluster.

apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: camunda
type: Opaque
stringData:
  ACCESS_KEY_ID: minioadmin
  ACCESS_SECRET_KEY: minioadmin
