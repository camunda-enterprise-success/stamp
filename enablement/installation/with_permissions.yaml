# Layer 2 (+permissions) - additive layer on top of minimal_setup.yaml, adding OIDC-based
# authentication and fine-grained authorization (roles, mapping rules, authorizations). Applied
# via an extra `-f` flag alongside minimal_setup.yaml - see the README's "Design intent" section
# and the Architecture Overview table.
#
# The OIDC provider itself is an external dependency, not something this file or the
# camunda-platform chart provisions: this guide points it at an in-cluster Keycloak
# (keycloak/keycloak-instance.yaml), but any OIDC-compliant IdP (Entra ID, Okta, Auth0, ...)
# works the same way from Camunda's perspective - only the endpoints/clientId/secret below
# change, never the shape of this file.

global:
  security:
    authentication:
      method: oidc

orchestration:
  security:
    initialization:
      defaultRoles:
        admin:
          users:
            - "admin"
      ## @param orchestration.security.initialization.mappingRules defines the mapping rules when connected to an OIDC provider.
      mappingRules:
        - mappingRuleId: operator-role
          claimName: realm_access.roles
          claimValue: operator
        - mappingRuleId: task-user-role
          claimName: realm_access.roles
          claimValue: task-user
        - mappingRuleId: benchmark-client
          claimName: client_id
          claimValue: benchmark-client
      ## @param orchestration.security.initialization.authorizations defines the authorizations for mapping rules.
      authorizations:
        # Operator role authorizations
        - ownerType: MAPPING_RULE
          ownerId: operator-role
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - READ_PROCESS_DEFINITION
            - READ_PROCESS_INSTANCE
            - UPDATE_PROCESS_INSTANCE
            - MODIFY_PROCESS_INSTANCE
            - CANCEL_PROCESS_INSTANCE
            - DELETE_PROCESS_INSTANCE
        - ownerType: MAPPING_RULE
          ownerId: operator-role
          resourceType: BATCH
          resourceId: "*"
          permissions:
            - CREATE
            - CREATE_BATCH_OPERATION_CANCEL_PROCESS_INSTANCE
            - CREATE_BATCH_OPERATION_DELETE_PROCESS_INSTANCE
            - CREATE_BATCH_OPERATION_MIGRATE_PROCESS_INSTANCE
            - CREATE_BATCH_OPERATION_MODIFY_PROCESS_INSTANCE
            - CREATE_BATCH_OPERATION_RESOLVE_INCIDENT
            - CREATE_BATCH_OPERATION_DELETE_DECISION_INSTANCE
            - CREATE_BATCH_OPERATION_DELETE_DECISION_DEFINITION
            - CREATE_BATCH_OPERATION_DELETE_PROCESS_DEFINITION
            - READ
            - UPDATE
        - ownerType: MAPPING_RULE
          ownerId: operator-role
          resourceType: COMPONENT
          resourceId: operate
          permissions:
            - ACCESS
        # Task-user role authorizations
        - ownerType: MAPPING_RULE
          ownerId: task-user-role
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - READ_USER_TASK
            - UPDATE_USER_TASK
        - ownerType: MAPPING_RULE
          ownerId: task-user-role
          resourceType: COMPONENT
          resourceId: tasklist
          permissions:
            - ACCESS
        # Benchmark-client authorizations
        - ownerType: MAPPING_RULE
          ownerId: benchmark-client
          resourceType: PROCESS_DEFINITION
          resourceId: "*"
          permissions:
            - CREATE_PROCESS_INSTANCE
            - UPDATE_PROCESS_INSTANCE
        - ownerType: MAPPING_RULE
          ownerId: benchmark-client
          resourceType: RESOURCE
          resourceId: "*"
          permissions:
            - CREATE

    authentication:
      oidc:
        ## @param orchestration.security.authentication.oidc.clientId defines the client id, which is used by Orchestration Cluster in authentication flows.
        clientId: orchestration
        ## @param orchestration.security.authentication.oidc.audience defines the audience, which is used by Orchestration Cluster.
        audience: orchestration
        secret:
          existingSecret: "camunda-keycloak-client-secrets"
          existingSecretKey: "orchestration-secret"
        # All five URLs are the SAME in-cluster Keycloak realm URL (keycloak/keycloak-instance.yaml +
        # keycloak/create-realm-and-clients.sh). The fixed cluster-DNS hostname means the `iss` claim is
        # identical whether the token is validated by an in-cluster pod (via CoreDNS) or your
        # browser (via the /etc/hosts entry + port-forward). Update the realm segment if you
        # rename the realm in keycloak/create-realm-and-clients.sh.
        issuer: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform
        issuerBackendUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform
        tokenUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform/protocol/openid-connect/token
        jwksUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
        publicIssuerUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform
        type: "GENERIC"
        # No trailing slash - orchestration's own contextPath is "/" (root), and it builds its
        # callback URL as redirectUrl + "/sso-callback"; a trailing slash here would produce a
        # "//sso-callback" double-slash mismatch against the redirect URI keycloak/create-realm-and-clients.sh
        # registers in Keycloak.
        redirectUrl: "http://localhost:8080"
        # Configure the claim in the access token to identify a client, default: client_id
        clientIdClaim: client_id
        # Configure the claim in the access token to identify a user by, default: preferred_username
        usernameClaim: preferred_username
        # Configure the claim in the access token to retrieve groups from, default: groups
        groupsClaim: groups
        scope:
          - openid
          - profile
          - offline_access
        preferUsernameClaim: false
  multitenancy:
    checks:
      enabled: false # default
  api:
    enabled: true # default
  ingress:
    grpc:
      enabled: false
