# Credential Secrets the Camunda platform Helm release consumes from ITS OWN namespace, for the
# Elasticsearch + Optimize + Identity + Web Modeler variant (see the README). Same reasoning as
# camunda-secrets.yaml: Secrets are namespace-scoped, so credentials owned by resources in other
# namespaces must be copied here.
#
#   - identity-rdbms-credentials   -> identity.externalDatabase.secret (with_identity_webmodeler.yaml)
#     same values as postgresql/postgresql-cluster.yaml's "identity" role.
#   - webmodeler-rdbms-credentials -> webModeler.restapi.externalDatabase.secret (with_identity_webmodeler.yaml)
#     same values as postgresql/postgresql-cluster.yaml's "webmodeler" role.
#
# The Keycloak-facing credentials (admin password, Identity/Optimize client secrets) are NOT here -
# they live in the single "camunda-credentials" Secret that keycloak/create-realm-and-clients.sh
# (CREATE_VARIANT_CLIENTS=true) writes alongside the Keycloak clients themselves, using the exact
# key names from Camunda's own external-Keycloak example. Keeping both in one place, written by the
# same script that creates the matching Keycloak clients, means the two can never drift out of sync
# the way two independently-maintained sources could.
#
# (elasticsearch-es-elastic-user is NOT here either - it's ECK-generated, not a static dev value, so
# elasticsearch/copy-elastic-secret.sh copies the real one instead.)
#
# Apply this before the `helm upgrade --install` step in the Variant section of the README. Swap
# the inlined dev values for generated passwords before this is anything but a local/dev cluster.

apiVersion: v1
kind: Secret
metadata:
  name: identity-rdbms-credentials
  namespace: camunda
type: kubernetes.io/basic-auth
stringData:
  username: identity
  password: identity
---
apiVersion: v1
kind: Secret
metadata:
  name: webmodeler-rdbms-credentials
  namespace: camunda
type: kubernetes.io/basic-auth
stringData:
  username: webmodeler
  password: webmodeler
