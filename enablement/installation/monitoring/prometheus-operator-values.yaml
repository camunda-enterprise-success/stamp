# Values for the `kube-prometheus-stack` chart (prometheus-community) - NOT for camunda-platform.
#
# The monitoring stack is an external dependency: the camunda-platform chart never deploys or owns
# Prometheus/Grafana, it only exposes a scrape target (see with_monitoring_alerting.yaml, "Layer 3").
# In a real deployment this would be a hosted observability stack and this file would go away -
# only the scrape target stays. See README.md#why-operators--and-what-else-you-could-use.
#
# Installed into the `default` namespace by step 1 of either guide. Alertmanager is off (alerts are
# Grafana-managed, see camunda-alerts-grafana-managed.yaml); Grafana's admin credentials come from
# the `grafana-secret` Secret built from grafana-secret.yaml.template.

alertmanager:
  enabled: false

grafana:
  image:
    tag: 11.6.0
  admin:
    existingSecret: grafana-secret
    userKey: admin-user
    passwordKey: admin-password

  smtp:
    enabled: true
    existingSecret: "grafana-secret"
    passwordKey: "gmail-password"
    userKey: "gmail-email"

  grafana.ini:
    # smtp setup
    smtp:
      enabled: true
      host: smtp.gmail.com:587
      from_address: jeliwi00@gmail.com

  extraSecretMounts:
    - name: grafana-secret
      secretName: grafana-secret
      mountPath: /etc/secrets/grafana-secret
      readOnly: true

  # Mount alert provisioning
  extraConfigmapMounts:
    - name: grafana-alerts
      mountPath: /etc/grafana/provisioning/alerting/
      configMap: grafana-alerts

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder:
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      zeebe:
        urlold: https://raw.githubusercontent.com/zeebe-io/zeebe/develop/monitor/grafana/zeebe.json
        url: https://raw.githubusercontent.com/camunda/camunda/main/monitor/grafana/zeebe.json

  persistence:
    enabled: true
#    storageClassName: ssd
  sidecar:
    dashboards:
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 90d
    shards: 1
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
#          storageClassName: ssd

