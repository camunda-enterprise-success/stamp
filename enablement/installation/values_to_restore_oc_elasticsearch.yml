# Zeebe runtime (primary storage) RESTORE overlay for the Elasticsearch + Optimize variant - the
# Camunda-side half of the restore. The Elasticsearch counterpart of values_to_restore_oc.yml (the
# RDBMS track's restore overlay). Layered ON TOP of ./minimal_setup_elasticsearch.yaml (which supplies
# the Elasticsearch secondary-storage wiring and disables Optimize/Identity/Web Modeler/connectors),
# exactly the way the RDBMS track layers its restore overlay on ./minimal_setup.yaml:
#
#   helm upgrade --install camunda camunda-platform --repo https://helm.camunda.io \
#     --version 14.7.0 --namespace camunda \
#     -f ./minimal_setup_elasticsearch.yaml \
#     -f ./values_to_restore_oc_elasticsearch.yml
#
# Prerequisites (see the README "Restore (Elasticsearch variant)" section): the Elasticsearch
# snapshots for this same backupId have ALREADY been restored (backup_elasticsearch/restore/
# es-snapshot-restore-job.yaml, after deleting the old indices and re-registering the repos), and
# Zeebe's PVC is empty. This run rebuilds Zeebe's local state from the matching runtime backup in
# MinIO. Because Elasticsearch (unlike the RDBMS track) does not record the exporter position for the
# engine to auto-discover the right backup, the backupId is passed EXPLICITLY via
# ZEEBE_RESTORE_FROM_BACKUP_ID, read from the same camunda-backup-config ConfigMap the backup used.
#
# The restore container exits when done; Kubernetes then reports CrashLoopBackOff on the pod (it
# restarts, sees the now-restored non-empty data dir, and logs "data directory ... is not empty") -
# that is the EXPECTED success state. Check `kubectl logs <pod> --previous` for the restore success
# line, then redeploy with the normal Variant values (README step) to return to service - at which
# point Optimize reads the restored optimize-* indices again.

orchestration:
  env:
    - name: ZEEBE_BROKER_EXECUTION_METRICS_EXPORTER_ENABLED
      value: "true"

    # Turn the orchestration pod into a restore run against a specific backupId.
    - name: SPRING_PROFILES_ACTIVE
      value: "restore"
    - name: ZEEBE_RESTORE
      value: "true"
    - name: ZEEBE_RESTORE_FROM_BACKUP_ID
      valueFrom:
        configMapKeyRef:
          name: camunda-backup-config
          key: BACKUP_ID

    # --- Same MinIO runtime-backup source as values_with_backup_restore_elasticsearch.yml ---
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_STORE
      value: "S3"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_BUCKETNAME
      value: "camunda-backups"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_BASEPATH
      value: "oc-runtime"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_ENDPOINT
      value: "http://minio.minio.svc.cluster.local:9000"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_REGION
      value: "eu-central-1"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_FORCEPATHSTYLEACCESS
      value: "true"
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_ACCESSKEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: ACCESS_KEY_ID
    - name: CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_SECRETKEY
      valueFrom:
        secretKeyRef:
          name: minio-credentials
          key: ACCESS_SECRET_KEY
