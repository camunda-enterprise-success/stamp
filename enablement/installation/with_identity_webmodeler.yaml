# Layer 3b (+identity+webmodeler) - additive on top of minimal_setup_elasticsearch.yaml (+
# with_permissions.yaml + with_optimize.yaml). Depends on with_optimize.yaml specifically: it
# reuses the global.identity.keycloak.* "External Keycloak" connection block established there
# (this file only adds the Web Modeler sub-key under global.identity.auth, plus enables the two
# component deployments).
#
# Management Identity and Web Modeler are one layer, not two, because the chart's own values.yaml
# says so directly: "Management Identity is always required by WebModeler." Each gets its own
# database on the shared CNPG instance (postgresql/postgresql-cluster.yaml's managed.roles +
# postgresql/postgresql-databases-identity-webmodeler.yaml's Database CRs) rather than the
# deprecated identityPostgresql/webModelerPostgresql Bitnami subcharts - same operator-based
# replacement principle as Elasticsearch. Note this is NOT strictly required by the chart in
# "External Keycloak" mode (Keycloak can store Identity's data itself unless multitenancy is on) -
# it's configured explicitly here to demonstrate the CNPG pattern end-to-end for these two
# components, per this guide's request.
#
# orchestration's OWN OIDC client/audience (orchestration.security.authentication.oidc, set in
# ../with_permissions.yaml, layered before this file) is already "orchestration" - the same client
# keycloak/create-realm-and-clients.sh always prepares - so no override is needed here.
#
# identity.env below (KEYCLOAK_REALM / IDENTITY_CLIENTID) is Camunda's own documented external-
# Keycloak pattern for telling Management Identity which pre-existing realm/client to use -
# "Option 1: prepare an existing realm":
# https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/external-keycloak/#configure-the-helm-chart
# identity.firstUser overrides the chart's default first-user username ("demo") to "admin", so the
# login matches every other credential in this guide (defaultRoles.admin.users in
# ../with_permissions.yaml, the "admin" realm user keycloak/create-realm-and-clients.sh already
# creates).

global:
  identity:
    auth:
      webModeler:
        # Works if a port-forward to Web Modeler is created to 8070 (see the README's "Accessing
        # the UIs" step in the Variant section). Includes webModeler.contextPath below, matching
        # create-realm-and-clients.sh's WEBMODELER_URL.
        redirectUrl: "http://localhost:8070/modeler"

identity:
  enabled: true
  contextPath: "/identity"
  # For a port-forward to Identity on 8084 (see the README's "Accessing the UIs" step) - includes
  # the contextPath above, matching create-realm-and-clients.sh's IDENTITY_URL. No firstUser/env
  # block: those are the KEYCLOAK-type admin-API mechanism (../with_optimize.yaml's auth.type
  # comment) - under GENERIC, the pre-created "admin" Keycloak user becomes Identity's admin via
  # global.identity.auth.identity.initialClaimName/initialClaimValue instead.
  fullURL: "http://localhost:8084/identity"
  externalDatabase:
    enabled: true
    # pg-camunda-rw is the CloudNativePG-managed read-write Service from
    # postgresql/postgresql-cluster.yaml (postgres namespace) - reached cross-namespace via its
    # FQDN, same as the RDBMS track's minimal_setup.yaml.
    host: pg-camunda-rw.postgres.svc.cluster.local
    port: 5432
    database: identity
    username: identity
    secret:
      existingSecret: identity-rdbms-credentials
      existingSecretKey: password
  resources:
    requests:
      cpu: 600m
      memory: 400Mi
    limits:
      cpu: 2000m
      memory: 2Gi

identityPostgresql:
  enabled: false

webModeler:
  enabled: true
  contextPath: "/modeler"
  restapi:
    externalDatabase:
      enabled: true
      host: pg-camunda-rw.postgres.svc.cluster.local
      port: 5432
      database: webmodeler
      username: webmodeler
      secret:
        existingSecret: webmodeler-rdbms-credentials
        existingSecretKey: password
    mail:
      # Mandatory - Web Modeler fails its readiness probe without a fromAddress, even though no
      # real SMTP server is configured in this local/dev setup.
      fromAddress: "noreply@camunda.local"
      fromName: "Camunda Platform"
    resources:
      requests:
        cpu: 900m
        memory: 1280Mi
      limits:
        cpu: 1800m
        memory: 2560Mi

webModelerPostgresql:
  enabled: false
