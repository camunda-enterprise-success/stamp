# Layer 2b (+optimize) - additive on top of minimal_setup_elasticsearch.yaml (+
# with_permissions.yaml). Only composes with the Elasticsearch base, never minimal_setup.yaml -
# Optimize has no RDBMS mode, it only reads Elasticsearch/OpenSearch. It imports from the SAME
# Elasticsearch index the orchestration cluster's "camunda" exporter already writes to
# (minimal_setup_elasticsearch.yaml's orchestration.exporters.camunda.enabled: true) - nothing
# about the exporter or the Elasticsearch cluster itself changes here, only Optimize's own
# deployment and its OIDC wiring.
#
# global.identity.auth.* below is the foundation with_identity_webmodeler.yaml builds on: unlike
# orchestration's own OIDC client (with_permissions.yaml's orchestration.security.authentication.oidc),
# Optimize/Identity/Web Modeler share ONE OIDC provider connection block (global.identity.auth's
# top-level publicIssuerUrl/issuerBackendUrl/authUrl/tokenUrl/jwksUrl) plus per-component client
# config under global.identity.auth.*.
#
# Every OIDC client is created explicitly, up front, by keycloak/create-realm-and-clients.sh,
# rather than relying on Management Identity's own startup-time
# self-provisioning (that self-provisioning path is tied to global.identity.auth.type: "KEYCLOAK"
# and was found non-idempotent in this repo's testing - see this file's auth.type comment below
# and create-realm-and-clients.sh's header comment). type: "GENERIC" (below) is what actually
# disables it - Camunda's "external Keycloak" doc page still describes the KEYCLOAK-type flow:
# https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/external-keycloak/#configure-components-using-oidc
# but this guide instead follows the generic-OIDC-provider doc's complete example, treating
# Keycloak as just another OIDC IdP:
# https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/generic-oidc-provider/#complete-configuration-example
#
# All Keycloak-facing credentials below (admin password, Optimize's client secret) come from one
# consolidated Secret, "camunda-credentials", using the exact key names from Camunda's own
# external-Keycloak example - written by create-realm-and-clients.sh alongside the clients
# themselves, so the Keycloak side and the K8s Secret side can never drift out of sync.

global:
  identity:
    auth:
      enabled: true
      # GENERIC, not KEYCLOAK: the KEYCLOAK type activates Identity's own "keycloak" Spring
      # profile, which runs KeycloakPresetInitializer - it unconditionally tries to CREATE every
      # resource-server client (orchestration, optimize, ...) via Keycloak's admin API on every
      # startup, so it 409-crashes as soon as those clients already exist (which
      # create-realm-and-clients.sh guarantees from the very first apply). GENERIC skips that
      # initializer entirely and treats Keycloak as a plain OIDC provider via the explicit
      # endpoint URLs below - same pattern orchestration's own OIDC config already uses
      # (../with_permissions.yaml's orchestration.security.authentication.oidc.type: "GENERIC").
      # https://docs.camunda.io/docs/self-managed/deployment/helm/configure/authentication-and-authorization/generic-oidc-provider/
      type: "GENERIC"
      publicIssuerUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform
      issuerBackendUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform
      authUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform/protocol/openid-connect/auth
      tokenUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform/protocol/openid-connect/token
      jwksUrl: http://keycloak-service.keycloak.svc.cluster.local:18080/auth/realms/camunda-platform/protocol/openid-connect/certs
      identity:
        # Matches create-realm-and-clients.sh's IDENTITY_CLIENT_ID/IDENTITY_AUDIENCE defaults.
        # Unlike KEYCLOAK type, GENERIC mode has no admin-API access to Keycloak, so Identity
        # needs its own client secret (below) and a claim-based rule (initialClaimName/Value) to
        # recognize the pre-created "admin" user as its first admin, instead of the
        # KEYCLOAK-only identity.firstUser mechanism (../with_identity_webmodeler.yaml no longer
        # sets it).
        clientId: camunda-identity
        audience: camunda-identity-resource-server
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-client-secret"
        initialClaimName: preferred_username
        initialClaimValue: admin
      optimize:
        # Works if a port-forward to Optimize is created to 8090 (see the README's "Accessing the
        # UIs" step in the Variant section). Includes optimize.contextPath below, matching
        # keycloak/create-realm-and-clients.sh's OPTIMIZE_URL.
        redirectUrl: "http://localhost:8090/optimize"
        secret:
          existingSecret: "camunda-credentials"
          existingSecretKey: "identity-optimize-client-token"

optimize:
  enabled: true
  contextPath: "/optimize"
  # Must match orchestration.partitionCount (minimal_setup_elasticsearch.yaml: "1").
  partitionCount: "1"
  database:
    elasticsearch:
      enabled: true
      # true = connect to an externally-managed Elasticsearch (the ECK instance), not the
      # deprecated bundled Bitnami subchart.
      external: true
      url:
        protocol: http
        host: elasticsearch-es-http.elasticsearch.svc.cluster.local
        port: 9200
      auth:
        username: elastic
        secret:
          existingSecret: "elasticsearch-es-elastic-user"
          existingSecretKey: "elastic"
  resources:
    requests:
      cpu: 600m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
