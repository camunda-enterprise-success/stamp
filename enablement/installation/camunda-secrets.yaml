# Credential Secrets the Camunda platform Helm release consumes from ITS OWN namespace.
#
# Kubernetes Secrets are namespace-scoped: the Camunda chart can only read an `existingSecret`
# / env `secretKeyRef` that lives in the release namespace (camunda). Since PostgreSQL and
# MinIO now run in their own namespaces (postgres / minio), the credentials they own must be
# copied here for Camunda to use:
#
#   - camunda-rdbms-credentials -> orchestration.data.secondaryStorage.rdbms.secret
#     (minimal_setup.yaml / without_auth.yaml) - same values as postgresql/postgresql-cluster.yaml.
#   - minio-credentials         -> CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_ACCESSKEY/SECRETKEY
#     (values_with_backup_restore.yml / values_to_restore_oc.yml) - same values
#     as backup/minio.yaml.
#
# Apply this before the `helm upgrade --install` of the Camunda platform (see the README).
# Swap the inlined dev values for generated passwords before this is anything but a local/dev
# cluster.

apiVersion: v1
kind: Secret
metadata:
  name: camunda-rdbms-credentials
  namespace: camunda
type: kubernetes.io/basic-auth
stringData:
  username: camunda
  password: camunda
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: camunda
type: Opaque
stringData:
  ACCESS_KEY_ID: minioadmin
  ACCESS_SECRET_KEY: minioadmin
